services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: paysecure
      POSTGRES_USER: paysecure
      POSTGRES_PASSWORD: local-only-password
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paysecure -d paysecure"]
      interval: 5s
      timeout: 3s
      retries: 20
  kafka:
    image: apache/kafka:3.8.1
    hostname: kafka
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports: ["9092:9092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
  kafka-init:
    image: apache/kafka:3.8.1
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic paysecure.payment-events --partitions 1 --replication-factor 1
    restart: "no"
  api:
    build: .
    command: ["api"]
    environment:
      DATABASE_URL: postgres://paysecure:local-only-password@postgres:5432/paysecure?sslmode=disable
      HTTP_ADDR: :8080
      REGION: local
      MERCHANT_API_KEYS: merchant-demo-001=local-demo-api-key
    ports: ["${PAYSECURE_HOST_PORT:-8080}:8080"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
  outbox-publisher:
    build: .
    command: ["publisher"]
    environment:
      DATABASE_URL: postgres://paysecure:local-only-password@postgres:5432/paysecure?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: paysecure.payment-events
      REGION: local
    depends_on:
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    restart: unless-stopped
  processor:
    build: .
    command: ["processor"]
    environment:
      DATABASE_URL: postgres://paysecure:local-only-password@postgres:5432/paysecure?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: paysecure.payment-events
      KAFKA_GROUP: paysecure-demo-processor
    depends_on:
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    restart: unless-stopped
  settlement-engine:
    build: .
    command: ["settlement"]
    environment:
      DATABASE_URL: postgres://paysecure:local-only-password@postgres:5432/paysecure?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: paysecure.payment-events
      REGION: local
    depends_on:
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    restart: unless-stopped
volumes:
  pgdata: {}
